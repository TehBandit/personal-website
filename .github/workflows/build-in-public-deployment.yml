name: build-in-public deployment monitor

on:
  deployment_status:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.18.0

      - name: Inspect deployment
        id: deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
          DEPLOYMENT_STATE: ${{ github.event.deployment_status.state }}
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment.environment }}
        run: node scripts/build-in-public/deployment-status.mjs

      - name: Send deployment failure email
        if: ${{ steps.deployment.outputs.notify == 'true' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BUILD_IN_PUBLIC_ALERT_TO: ${{ vars.BUILD_IN_PUBLIC_ALERT_TO }}
          BUILD_IN_PUBLIC_ALERT_FROM: ${{ vars.BUILD_IN_PUBLIC_ALERT_FROM }}
          ALERT_SUBJECT: build-in-public deployment failed
          ALERT_MESSAGE: >-
            The generated post deployment to ${{ steps.deployment.outputs.environment }} failed.
            Commit: ${{ steps.deployment.outputs.commit_subject }}.
            Review ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.
        run: node scripts/build-in-public/notify.mjs

      - name: Send deployment monitor error email
        if: ${{ failure() }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BUILD_IN_PUBLIC_ALERT_TO: ${{ vars.BUILD_IN_PUBLIC_ALERT_TO }}
          BUILD_IN_PUBLIC_ALERT_FROM: ${{ vars.BUILD_IN_PUBLIC_ALERT_FROM }}
          ALERT_SUBJECT: build-in-public deployment monitor failed
          ALERT_MESSAGE: >-
            The deployment monitor encountered an error.
            Review ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.
        run: node scripts/build-in-public/notify.mjs
